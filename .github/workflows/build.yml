name: Build and Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore
        run: dotnet restore CleanArchitectureApi.sln
      - name: Build
        run: dotnet build CleanArchitectureApi.sln --no-restore --configuration Release
      - name: Test
        run: dotnet test CleanArchitectureApi.sln --no-build --configuration Release
